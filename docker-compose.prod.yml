# =============================================================================
# Production Docker Compose - Stock Sense AI
# =============================================================================
# This configuration adds an Nginx reverse proxy for:
# - SSL/TLS termination
# - Static file caching
# - Gzip compression
# - Rate limiting
# - Security headers
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: stock-sense-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Uncomment for SSL certificates
      # - ./nginx/ssl:/etc/nginx/ssl:ro
      # - ./nginx/certbot/conf:/etc/letsencrypt:ro
      # - ./nginx/certbot/www:/var/www/certbot:ro
      - nginx-cache:/var/cache/nginx
    depends_on:
      stock-sense-ai:
        condition: service_healthy
    networks:
      - stock-sense-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Stock Sense AI Application
  # ---------------------------------------------------------------------------
  stock-sense-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stock-sense-ai
    restart: unless-stopped
    # Only expose to internal network, nginx handles external traffic
    expose:
      - "3001"
    volumes:
      - stock-data:/app/data
      - stock-config:/app/config
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - PORT=3001
      - AUTH_REQUIRED=true
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - stock-sense-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  # ---------------------------------------------------------------------------
  # (Optional) Certbot for Let's Encrypt SSL
  # ---------------------------------------------------------------------------
  # Uncomment this service to enable automatic SSL certificate management
  # certbot:
  #   image: certbot/certbot
  #   container_name: stock-sense-certbot
  #   volumes:
  #     - ./nginx/certbot/conf:/etc/letsencrypt
  #     - ./nginx/certbot/www:/var/www/certbot
  #   entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
  #   networks:
  #     - stock-sense-network

volumes:
  stock-data:
    name: stock-sense-data
  stock-config:
    name: stock-sense-config
  nginx-cache:
    name: stock-sense-nginx-cache

networks:
  stock-sense-network:
    driver: bridge
    name: stock-sense-network
