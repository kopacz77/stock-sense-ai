services:
  stock-sense-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stock-sense-ai
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      # Persist data across container restarts
      - stock-data:/app/data
      - stock-config:/app/config
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - PORT=3001
      # Set to 'true' for production with authentication
      - AUTH_REQUIRED=false
    env_file:
      # Load API keys and secrets from .env file
      - .env
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - stock-sense-network
    # Resource limits (optional, uncomment if needed)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1.0'
    #       memory: 512M
    #     reservations:
    #       cpus: '0.25'
    #       memory: 256M

volumes:
  # Named volumes for data persistence
  stock-data:
    name: stock-sense-data
  stock-config:
    name: stock-sense-config

networks:
  stock-sense-network:
    driver: bridge
    name: stock-sense-network
